<script type="text/javascript">
	var langue = navigator.language;

	function positionMolette(X, Y) {

	}
	function recupLangue() {

	function pleinEcran(OUI) {
		if (OUI) {
			document.getElementById("banniere") && (document.getElementById("banniere").style.display = "none");
		} else {
			document.getElementById("banniere") && (document.getElementById("banniere").style.display = "inline");
		}
	}
	function cancelEvent(e) {
		if (navigator.userAgent.indexOf("hrome") != -1) {
			document.getElementById("swf2").x_moletteTransformice(e.wheelDelta);
		}
		e = e ? e : window.event;
		if (e.stopPropagation)
			e.stopPropagation();
		if (e.preventDefault)
			e.preventDefault();
		e.cancelBubble = true;
		e.cancel = true;
		e.returnValue = false;
		return false;
	}
	function hookEvent(element, eventName, callback) {
		if (element.addEventListener) {
			if (eventName == 'mousewheel') {
				element.addEventListener('DOMMouseScroll', callback, false);
			}
			element.addEventListener(eventName, callback, false);
		} else if (element.attachEvent) {
			element.attachEvent("on" + eventName, callback);
		}
	}
</script>
