<!DOCTYPE html>
<html>

<title>Bouboum !</title>
<meta charset="UTF-8">
<style>
	html, body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		background: #575f44;
		overflow: hidden;
	}
	#bouboum {
		position: fixed;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
	}
	object, embed {
		width: 100%;
		height: 100%;
	}
</style>
</head>
<body>

<script>
	var langue = navigator.language;
	if (!langue) { langue = navigator.browserLanguage; }
	langue = langue.substr(0, 2);

	function positionMolette(X, Y) {}
	function activerMolette(OUI, HAUT) {}
	function recupLangue() { return langue; }
	function pleinEcran(OUI) {}
	function cancelEvent(e) {
		if (navigator.userAgent.indexOf("hrome") != -1) {
			document.getElementById("swf2").x_moletteTransformice(e.wheelDelta);
		}
		e = e ? e : window.event;
		if (e.stopPropagation) e.stopPropagation();
		if (e.preventDefault) e.preventDefault();
		e.cancelBubble = true;
		e.cancel = true;
		e.returnValue = false;
		return false;
	}
	function hookEvent(element, eventName, callback) {
		if (element.addEventListener) {
			if (eventName == 'mousewheel') {
				element.addEventListener('DOMMouseScroll', callback, false);
			}
			element.addEventListener(eventName, callback, false);
		} else if (element.attachEvent) {
			element.attachEvent("on" + eventName, callback);
		}
	}
</script>
